name: Platform

on:
  push:
    branches:
      - main
      - master
      - release
      - develop
  # Started by viewer-update.yml: a push made with GITHUB_TOKEN doesn't trigger workflows
  workflow_dispatch:

# A new push cancels the previous run, except on release branches: it could stop a publish midway
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/develop", "refs/heads/release", "refs/heads/master", "refs/heads/main"]'), github.ref) }}

env:
  app: platform

permissions: {}

jobs:
  build-and-push:
    permissions:
      contents: read
    runs-on: self-hosted-common
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Login to BIMData Docker Registry
        uses: docker/login-action@v4
        with:
          registry: docker-registry.bimdata.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - id: tag
        name: Get docker tag
        uses: bimdata/actions/get-docker-tag@v6
        with:
          branch: ${{ github.ref }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: etc/withprevious.Dockerfile
          push: true
          pull: true
          build-args: |
            PREVIOUS_TAG=${{ env.tag }}
          tags: |
            docker-registry.bimdata.io/bimdata/${{ env.app }}:${{ github.sha }}
            docker-registry.bimdata.io/bimdata/${{ env.app }}:${{ env.tag }}
          # Runners are ephemeral: layer cache per environment in our registry, falling back on staging
          cache-from: |
            type=registry,ref=docker-registry.bimdata.io/bimdata/${{ env.app }}:buildcache-${{ env.tag }}
            type=registry,ref=docker-registry.bimdata.io/bimdata/${{ env.app }}:buildcache-staging
          cache-to: type=registry,ref=docker-registry.bimdata.io/bimdata/${{ env.app }}:buildcache-${{ env.tag }},mode=max,image-manifest=true

  unit-tests:
    permissions:
      contents: read
    runs-on: self-hosted-common
    needs: build-and-push
    if: ${{ !contains(github.event.head_commit.message, '[skip unit]') &&
      github.ref != 'refs/heads/main' &&
      github.ref != 'refs/heads/master' &&
      github.ref != 'refs/heads/release' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          cache: npm
      - name: Run unit tests
        run: npm install && npm run test:unit

  deploy:
    runs-on: self-hosted-deploy
    needs: build-and-push
    steps:
      - name: Login to BIMData Docker Registry
        uses: docker/login-action@v4
        with:
          registry: docker-registry.bimdata.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - id: tag
        name: Get docker tag
        uses: bimdata/actions/get-docker-tag@v6
        with:
          branch: ${{ github.ref }}
      - name: Deploy on ${{ env.tag }}
        uses: bimdata/actions/deployment@v6
        with:
          inventory: ${{ env.tag }}
          app: ${{ env.app }}
          vault-pass: ${{ secrets.ANSIBLE_VAULT_PASSWD }}

  release:
    permissions:
      contents: write # Required for creating tag / release
      pull-requests: write # Required to add the comment on the PR to tell it's in the releases
      issues: write # Required to add a comment to an issue fixed in a release
    runs-on: self-hosted-common
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
